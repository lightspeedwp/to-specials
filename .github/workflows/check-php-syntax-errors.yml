name: PHP syntax

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Checking PHP syntax error
      uses: overtrue/phplint@9.8
      with:
        path: .
        options: --exclude=*.log
